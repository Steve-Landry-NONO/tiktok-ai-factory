services:
  - type: web
    name: tiktok-ai-factory-api-eu
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: FACTORY_API_TOKEN
        sync: false
      - key: FACTORY_API_HOST
        value: 0.0.0.0
      - key: FACTORY_API_LOG_LEVEL
        value: info
      - key: FACTORY_OUTPUT_ROOT
        value: /app/output/api
      - key: FACTORY_API_LIGHTWEIGHT_MOCK
        value: "1"
      - key: FACTORY_DURABLE_STORAGE_REQUIRED
        value: "1"
      - key: FACTORY_MEDIA_BUCKET
        value: tiktok-media
      - key: SUPABASE_URL
        value: https://sklzxgdfbclghwfoataq.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
