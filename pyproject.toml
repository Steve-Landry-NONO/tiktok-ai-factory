[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tiktok-ai-factory"
version = "2.0.0"
description = "Provider-driven intelligent TikTok video factory"
requires-python = ">=3.11"
dependencies = ["pydantic==2.11.7", "pydantic-settings==2.10.1", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.7", "mypy==1.17.1"]

[project.scripts]
tiktok-factory = "tiktok_factory.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local ffmpeg", "e2e: produces a complete local video"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tiktok_factory"]


[tool.ruff.lint]
ignore = ["E501", "E701", "E702"]
