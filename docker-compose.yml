services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: factory
    ports: ["5432:5432"]
    volumes: ["factory_db:/var/lib/postgresql/data"]

  factory-api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./output:/app/output
    restart: unless-stopped

volumes:
  factory_db: {}
