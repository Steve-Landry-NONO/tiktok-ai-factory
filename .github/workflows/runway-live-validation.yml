name: Runway V3 Live Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref containing the Runway V3 implementation"
        required: true
        default: "codex/construire-v1-pour-tiktok-ai-factory-kzrrmx"
      idea:
        description: "TikTok seed for the first real AI video"
        required: true
        default: "A futuristic city where gravity reverses for exactly one minute every midnight"
      max_cost_usd:
        description: "Hard generation budget for this run"
        required: true
        default: "5.0"

permissions:
  contents: read

jobs:
  validate-runway-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      LLM_PROVIDER: groq
      VIDEO_PROVIDER: runway
      RUNWAY_MODEL: gen4.5
      RUNWAY_RATIO: "720:1280"
      RUNWAY_CREDITS_PER_SECOND: "12"
      MAX_COST_PER_VIDEO: ${{ inputs.max_cost_usd }}
      MAX_DAILY_GENERATION_COST: ${{ inputs.max_cost_usd }}
      MAX_RETRIES: "3"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}" || { echo "GROQ_API_KEY is missing"; exit 20; }
          test -n "${RUNWAY_API_KEY:-}" || { echo "RUNWAY_API_KEY is missing"; exit 21; }
          test -n "${SUPABASE_SECRET_KEY:-}" || { echo "SUPABASE_SECRET_KEY is missing"; exit 22; }
          test -n "${SUPABASE_URL:-}" || { echo "SUPABASE_URL is missing"; exit 23; }
          echo "Required live configuration is present."
          echo "Hard Runway generation budget: $MAX_COST_PER_VIDEO USD"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Test suite
        run: pytest -q

      - name: Live Groq + Runway + Supabase pipeline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output/runway_live
          python -m tiktok_factory.cli intelligent-demo \
            --mode live \
            --video-provider runway \
            --output output/runway_live \
            --idea "${{ inputs.idea }}" \
            --correlation-id "runway-gha-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Inspect real AI MP4
        shell: bash
        run: |
          set -euo pipefail
          test -s output/runway_live/final.mp4
          test -s output/runway_live/metadata.json
          ffprobe \
            -v error \
            -show_entries stream=codec_name,codec_type,width,height,avg_frame_rate \
            -show_entries format=duration,size \
            -of json \
            output/runway_live/final.mp4 | tee output/runway_live/ffprobe.json

      - name: Upload real Runway artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runway-v3-live-${{ github.run_id }}
          path: |
            output/runway_live/final.mp4
            output/runway_live/metadata.json
            output/runway_live/ffprobe.json
            output/runway_live/clips/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
