name: V3.1 Live Rerender Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "V3.1 Git ref to validate"
        required: true
        default: "codex/mettre-a-jour-gestion-des-assets-v3.1"
      source_run_id:
        description: "Existing Runway workflow run ID"
        required: true
        default: "31800322094"
      source_artifact:
        description: "Existing Runway artifact name"
        required: true
        default: "runway-v3-live-31800322094"
      voice:
        description: "Groq Orpheus English voice"
        required: true
        default: "troy"

permissions:
  contents: read
  actions: read

jobs:
  validate-v3-1-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_TTS_MODEL: canopylabs/orpheus-v1-english
      GROQ_TTS_VOICE: ${{ inputs.voice }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout V3.1 ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate live configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}" || { echo "GROQ_API_KEY is missing"; exit 20; }
          unset RUNWAY_API_KEY || true
          echo "Groq TTS configuration is present."
          echo "Runway generation is intentionally disabled for V3.1 rerender."

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Static and unit validation
        run: |
          ruff check .
          mypy
          pytest -q

      - name: Download existing paid Runway artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.source_artifact }}
          path: input_artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Validate source artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s input_artifact/metadata.json
          test -d input_artifact/clips
          mapfile -t clips < <(find input_artifact/clips -type f -name '*.mp4' | sort)
          if [ "${#clips[@]}" -ne 4 ]; then
            echo "Expected exactly 4 existing Runway clips, found ${#clips[@]}"
            printf '%s\n' "${clips[@]}"
            exit 30
          fi
          printf 'Existing clip: %s\n' "${clips[@]}"
          echo "Source artifact validated; no new Runway generation will occur."

      - name: Live Groq TTS plus Pillow and FFmpeg rerender
        shell: bash
        run: |
          set -euo pipefail
          unset RUNWAY_API_KEY || true
          rm -rf output/v3_1_live
          python -m tiktok_factory.cli rerender-existing \
            --metadata input_artifact/metadata.json \
            --input-dir input_artifact/clips \
            --output output/v3_1_live

      - name: Verify zero Runway calls and QA manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('output/v3_1_live/metadata.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data.get('rerender_mode') == 'existing_assets', data.get('rerender_mode')
          assert data.get('runway_calls') == 0, data.get('runway_calls')
          assert data.get('hook_render_strategy') == 'pillow_overlay', data.get('hook_render_strategy')
          assert data.get('audio_provider') == 'groq_tts', data.get('audio_provider')
          for key in ('qa_text', 'qa_audio', 'qa_technical'):
              review = data.get(key) or {}
              assert review.get('outcome') == 'PASS', f"{key}: {review}"
          print('Manifest confirms zero Runway calls and PASS for text/audio/technical QA.')
          PY

      - name: Standalone audio and technical QA
        run: python -m tiktok_factory.cli qa-video --video output/v3_1_live/final.mp4

      - name: Inspect final MP4
        shell: bash
        run: |
          set -euo pipefail
          test -s output/v3_1_live/final.mp4
          ffprobe \
            -v error \
            -show_entries stream=index,codec_name,codec_type,width,height,avg_frame_rate \
            -show_entries format=duration,size \
            -of json \
            output/v3_1_live/final.mp4 | tee output/v3_1_live/ffprobe.json

      - name: Extract visual QA frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/v3_1_live/frames
          ffmpeg -y -ss 1.0 -i output/v3_1_live/final.mp4 -frames:v 1 output/v3_1_live/frames/hook.png >/dev/null 2>&1
          ffmpeg -y -ss 18.5 -i output/v3_1_live/final.mp4 -frames:v 1 output/v3_1_live/frames/cta.png >/dev/null 2>&1
          test -s output/v3_1_live/frames/hook.png
          test -s output/v3_1_live/frames/cta.png

      - name: Upload V3.1 validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v3-1-live-${{ github.run_id }}
          path: |
            output/v3_1_live/final.mp4
            output/v3_1_live/metadata.json
            output/v3_1_live/ffprobe.json
            output/v3_1_live/audio/**
            output/v3_1_live/overlays/**
            output/v3_1_live/frames/**
          if-no-files-found: error
          retention-days: 7
